<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3DRaffles</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">3DRaffles</div>
      <nav class="nav">
        <a class="btn" href="account.html">Create account</a>
        <a class="btn gray" href="account.html">Log in</a>
      </nav>
    </header>

    <section class="splash-banner" style="background-image:linear-gradient(90deg, rgba(10,20,16,.88), rgba(10,20,16,.35)), url('hero.png'); background-size:cover;">
      <div>
        <p class="status">Whitelist desk</p>
        <h1>Raffles and collabs for Web3 teams</h1>
        <p>Create a team, run whitelist raffles, and manage cross-project collabs.</p>
      </div>
    </section>

    <section class="split">
      <div class="card" style="padding:18px;">
        <h3>New raffles</h3>
        <div id="new-raffles"></div>
      </div>
      <div class="card" style="padding:18px;">
        <h3>Ending soon</h3>
        <div id="ending-soon"></div>
      </div>
    </section>
  </div>
  <script>
    function row(raffle) {
      return '<p class="meta"><a href="raffle.html?id=' + raffle.id + '">' +
        raffle.title + ' · ' + raffle.id + '</a></p>';
    }

    fetch('/api/raffles').then(r => r.json()).then(raffles => {
      const active = (raffles || []).filter(raffle => raffle.status === 'active');
      const newest = [...active].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 5);
      const ending = [...active].sort((a, b) => (a.endTime || 0) - (b.endTime || 0)).slice(0, 5);
      document.getElementById('new-raffles').innerHTML = newest.map(row).join('') || '<p class="meta">No new raffles.</p>';
      document.getElementById('ending-soon').innerHTML = ending.map(row).join('') || '<p class="meta">Nothing ending soon.</p>';
    });
  </script>
</body>
</html>
