<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
  <img class="top-pic" src="hero.png" alt="3DRaffles">
<body>
  <div class="wrap">
    <section class="hero">
      <h1>3DRaffles</h1>
      <p>Staff login</p>
    </section>
    <section class="card" style="padding:18px;">
      <p style="margin:12px 0;"><input id="password" type="password" placeholder="Password"></p>
      <button class="btn" id="login-btn">Log in</button>
      <p class="meta" id="result"></p>
    </section>
  </div>
  <script>
    document.getElementById('login-btn').onclick = async () => {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('password').value })
      });
      const data = await res.json();
      if (!res.ok) {
        document.getElementById('result').textContent = data.error || 'Failed';
        return;
      }
      window.location.href = '/raffles.html';
    };
  </script>

</section>
</body>
</html>
