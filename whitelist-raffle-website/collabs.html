<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collabs</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">3DCEASED RAFFLES</div>
      <nav class="nav">
        <a href="index.html">Raffles</a>
        <a href="teams.html">Teams</a>
        <a href="collabs.html">Collabs</a>
      </nav>
    </header>

    <section class="hero">
      <h1>Cross collabs</h1>
      <p>Send a whitelist-spot offer from one team to another.</p>
    </section>

    <section class="card" style="padding:18px; margin-bottom:24px;">
      <p style="margin:12px 0;"><input id="fromTeamId" placeholder="From team ID, example TEAM-0001"></p>
      <p style="margin:12px 0;"><input id="toTeamId" placeholder="To team ID, example TEAM-0002"></p>
      <p style="margin:12px 0;"><input id="spots" placeholder="WL spots, example 10"></p>
      <p style="margin:12px 0;"><input id="message" placeholder="Message"></p>
      <button class="btn" id="send-btn">Send collab offer</button>
      <p class="meta" id="result" style="margin-top:12px;"></p>
    </section>

    <section class="grid" id="collab-list"></section>
  </div>

  <script>
    async function loadCollabs() {
      const res = await fetch('/api/collabs');
      const collabs = await res.json();
      const list = document.getElementById('collab-list');

      if (!Array.isArray(collabs) || !collabs.length) {
        list.innerHTML = '<p class="meta">No collabs yet.</p>';
        return;
      }

      list.innerHTML = collabs.map(collab => {
        const raffleText = collab.raffleId
          ? ('Raffle: ' + collab.raffleId + ' — ' + (collab.raffleTitle || ''))
          : 'No raffle attached yet';

        let winnerText = '';
        if (collab.winners && collab.winners.length) {
          winnerText = '<br>Winners:<br>' + collab.winners.map((id, i) => {
            const email = (collab.winnerEmails && collab.winnerEmails[id]) || 'no email';
            return (i + 1) + '. ' + id + ' — ' + email;
          }).join('<br>');
        } else if (collab.raffleStatus === 'active') {
          winnerText = '<br>Raffle still running';
        }

        const attachBox = collab.status === 'accepted'
          ? '<p style="margin-top:12px;"><input id="raffle-' + collab.id + '" placeholder="RAFFLE-0011"></p>' +
            '<button class="btn" onclick="attachRaffle(\'' + collab.id + '\')">Attach raffle</button>'
          : '';

        return (
          '<article class="card"><div class="card-body">' +
          '<div class="status">' + collab.status + '</div>' +
          '<h3>' + collab.fromTeamName + ' → ' + collab.toTeamName + '</h3>' +
          '<p class="meta">' + collab.id + ' • ' + collab.spots + ' WL spots<br>' +
          (collab.message || '') + '<br>' + raffleText + winnerText + '</p>' +
          '<button class="btn" onclick="respond(\'' + collab.id + '\', \'accepted\')">Accept</button>' +
          '<button class="btn gray" onclick="respond(\'' + collab.id + '\', \'declined\')">Decline</button>' +
          attachBox +
          '</div></article>'
        );
      }).join('');
    }

    document.getElementById('send-btn').onclick = async () => {
      const result = document.getElementById('result');
      const res = await fetch('/api/collabs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fromTeamId: document.getElementById('fromTeamId').value,
          toTeamId: document.getElementById('toTeamId').value,
          spots: Number(document.getElementById('spots').value),
          message: document.getElementById('message').value
        })
      });
      const data = await res.json();
      result.textContent = res.ok ? ('Sent ' + data.id) : (data.error || 'Could not send collab');
      loadCollabs();
    };

    async function respond(id, action) {
      await fetch('/api/collabs/' + id + '/respond', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action })
      });
      loadCollabs();
    }

    async function attachRaffle(id) {
      const raffleId = document.getElementById('raffle-' + id).value;
      const res = await fetch('/api/collabs/' + id + '/raffle', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ raffleId })
      });
      const data = await res.json();
      if (!res.ok) {
        alert(data.error || 'Could not attach raffle');
        return;
      }
      loadCollabs();
    }

    loadCollabs();
  </script>
</body>
</html>
